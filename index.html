<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taklifnoma · демо</title>
<meta name="description" content="Демо конструктора онлайн-приглашений: вход через Telegram, шаблоны, оплата, RSVP гостей, кабинет организатора.">
<meta property="og:type" content="website">
<meta property="og:title" content="Taklifnoma · онлайн-приглашения">
<meta property="og:description" content="Соберите приглашение на той за 10 минут и получите ссылку для гостей.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&family=Prata&family=Lora:ital,wght@0,400;0,500;1,400&family=Forum&family=Montserrat:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ===== App chrome: a calm working tool; the invitations bring their own visual worlds ===== */
:root{
  --bg:#F3F3F0; --panel:#FFFFFF; --ink:#1B1D1C; --muted:#696D6A; --line:#E1E2DD; --soft:#EEEFEA;
  --brand:#2F5D50; --brand-2:#E4EDE9; --brand-ink:#FFFFFF; --warn:#B4542D; --ok:#2F7D4F; --ok-soft:#E3F1E8; --no:#A33A3A; --no-soft:#F6E5E3; --wait:#8A6D1F; --wait-soft:#F5EFD9;
  --f-ui:"Manrope","Helvetica Neue",Arial,sans-serif;
  --f-brand:"Cormorant Garamond","Times New Roman",serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.container{max-width:1120px;margin:0 auto}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(243,243,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .container{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.logo{font-family:var(--f-brand);font-size:1.6rem;font-weight:600;color:var(--ink);text-decoration:none;letter-spacing:.01em}
.logo span{color:var(--brand)}
.hdr-r{display:flex;align-items:center;gap:8px}
.demo-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:2px 8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#C9CBC4}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:0 5px}
.ico{width:18px;height:18px;flex:none}

h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.h1{font-family:var(--f-brand);font-weight:500;font-size:clamp(2.3rem,6vw,3.6rem);line-height:1.05}
.h2{font-size:1.35rem;font-weight:700}
.h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.no{background:var(--no-soft);color:var(--no)}.pill.wait{background:var(--wait-soft);color:var(--wait)}.pill.draft{background:var(--soft);color:var(--muted)}

/* landing */
.land{padding-block:48px 64px}
.land-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.land-hero p{font-size:1.08rem;max-width:34em}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.steps3 .panel{padding:20px}
.steps3 b{display:block;font-size:1.02rem;margin-bottom:4px}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.prices .panel{padding:16px}
.prices .sum{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:14px;justify-content:center}
.thumb{width:150px;flex:none;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.thumb .mini{height:210px;overflow:hidden;position:relative}
.thumb .mini .inv{transform:scale(.4);transform-origin:top left;width:250%;pointer-events:none}
.thumb .cap{padding:8px 10px;font-size:13px;font-weight:600;border-top:1px solid var(--line)}
.thumb:nth-child(2){transform:translateY(-18px)}

/* auth */
.auth{max-width:440px;margin:48px auto;padding:28px}
.code-in{display:flex;gap:8px;justify-content:center;margin:18px 0 8px}
.code-in input{width:46px;height:56px;text-align:center;font-size:1.5rem;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-variant-numeric:tabular-nums}
.code-in input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-2)}
.err{color:var(--no);font-size:13.5px;min-height:1.2em}
.tg-step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.tg-step:last-child{border-bottom:0}
.tg-step .n{width:26px;height:26px;border-radius:50%;background:var(--brand-2);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.tg-step.done .n{background:var(--brand);color:#fff}

/* dashboard */
.page{padding-block:28px 64px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ev-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ev-card{padding:18px;display:grid;gap:12px}
.ev-card .t{font-family:var(--f-brand);font-size:1.6rem;font-weight:500;line-height:1.1}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}
.kv b{font-variant-numeric:tabular-nums}
.empty{padding:40px 24px;text-align:center}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.stepper button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
.stepper button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:#fff}
.stepper button.done{color:var(--brand);border-color:var(--brand-2)}
.form{padding:22px;display:grid;gap:18px}
.f{display:grid;gap:6px}
.f > span{font-size:13px;font-weight:600;color:var(--muted)}
.f input[type=text],.f input[type=date],.f input[type=time],.f input[type=tel],.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);font-size:15px}
.f textarea{min-height:96px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted)}
.tpl-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl-opt{border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--panel);padding:0;text-align:left}
.tpl-opt[aria-pressed="true"]{border-color:var(--brand)}
.tpl-opt .mini{height:150px;overflow:hidden;position:relative}
.tpl-opt .mini .inv{transform:scale(.3);transform-origin:top left;width:333.33%;pointer-events:none}
.tpl-opt .cap{padding:8px 10px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.prog-row{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:start}
.prog-row .both{display:grid;gap:6px}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);width:36px;height:40px;font-size:18px}
.paid-box{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.paid-box .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.price-tag{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.radio-list{display:grid;gap:8px}
.radio-list label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.radio-list label:has(input:checked){border-color:var(--brand);background:var(--brand-2)}
.radio-list input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.radio-list .play{margin-left:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{accent-color:var(--brand);width:18px;height:18px;margin:2px 0 0;flex:none}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.form-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.total-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.total-bar b{font-size:1.15rem;font-variant-numeric:tabular-nums}

.preview-col{position:sticky;top:76px}
.phone{width:100%;max-width:390px;margin:0 auto;height:min(760px,calc(100vh - 160px));border:10px solid #1B1D1C;border-radius:40px;overflow:hidden;background:#000;position:relative}
.phone .scr{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.prev-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.mob-prev-btn{display:none}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(20,22,21,.55);display:flex;align-items:flex-end;justify-content:center}
.overlay .sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .sheet-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.overlay .sheet-b{overflow-y:auto;flex:1}

/* checkout + pay */
.narrow{max-width:520px;margin:0 auto}
.lines{display:grid;gap:0}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lines div.tot{border-bottom:0;font-weight:700;font-size:1.15rem}
.lines div.paid{color:var(--muted);text-decoration:line-through}
.pay-shell{max-width:440px;margin:32px auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.pay-top{background:#22252B;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pay-top small{opacity:.7;font-size:12px}
.pay-b{padding:22px;display:grid;gap:16px}
.cards{display:grid;gap:10px}
.cards label{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.cards label:has(input:checked){border-color:#22252B;box-shadow:0 0 0 2px rgba(34,37,43,.12)}
.cards input{accent-color:#22252B;width:18px;height:18px;margin:0}
.chip{width:42px;height:28px;border-radius:6px;flex:none}
.test-note{background:var(--wait-soft);color:var(--wait);border-radius:10px;padding:10px 12px;font-size:13px}
.spinner{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 0.9s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.sms{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;width:min(380px,calc(100% - 32px));background:rgba(30,32,34,.96);color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.3);font-size:13.5px;animation:drop .35s ease-out}
.sms b{display:block;font-size:12px;opacity:.7;font-weight:600;margin-bottom:2px}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}

/* done */
.done-hero{text-align:center;padding:28px 22px;display:grid;gap:14px;justify-items:center}
.check-big{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center}
.linkbox{display:flex;gap:8px;width:100%;max-width:520px}
.linkbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);font-size:13.5px}
.qr-box{width:168px;height:168px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px}
.qr-box svg{width:100%;height:100%;display:block}

/* event page */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:16px}
.stat b{display:block;font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.ok b{color:var(--ok)}.stat.no b{color:var(--no)}
.ev-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px}

/* bot panel (imitation of a Telegram-bot chat, unbranded) */
.bot{position:fixed;z-index:80;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));height:min(600px,calc(100vh - 100px));background:#DCE3EA;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.bot-h{background:#FFFFFF;padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #D3D9DF}
.bot-av{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-brand);font-weight:600;font-size:1.2rem;flex:none}
.bot-h .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.bot-h .st{font-size:12px;color:#6D7A86}
.bot-h .cl{margin-left:auto}
.bot-msgs{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-line;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg.b{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.msg.m{background:#E1F5D6;align-self:flex-end;border-bottom-right-radius:4px}
.msg .tm{display:block;text-align:right;font-size:11px;color:#8A949C;margin-top:2px}
.msg .code{font-size:1.25rem;font-weight:700;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.msg .file{display:flex;gap:10px;align-items:center}
.msg .file .fi{width:40px;height:40px;border-radius:10px;background:#2F7D4F;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.kb{display:grid;gap:6px;align-self:stretch;margin-top:2px}
.kb button{background:rgba(255,255,255,.75);border:0;border-radius:10px;padding:9px;font-weight:600;font-size:13.5px;cursor:pointer;color:#2A6FB0}
.bot-foot{background:#fff;padding:8px 12px;font-size:12px;color:#6D7A86;text-align:center;border-top:1px solid #D3D9DF}
.bot-fab{position:fixed;z-index:70;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;background:var(--ink);color:#fff;border:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.foot{padding-block:24px 90px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
.foot .container{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}

@media (max-width:900px){
  .land-hero{grid-template-columns:1fr}
  .builder{grid-template-columns:1fr}
  .preview-col{display:none}
  .mob-prev-btn{display:inline-flex}
  .ev-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .steps3{grid-template-columns:1fr}
  .prices{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .tpl-pick{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tpl-opt .mini{height:120px}
  .thumb{width:31%}
  .thumb .mini{height:170px}
  .thumb .mini .inv{transform:scale(.27);width:370%}
  .demo-tag{display:none}
}

/* ===== Invitation templates (each template is its own single-look world) ===== */
.inv{--paper:#F6F3EC;--surface:#FFFFFF;--ink:#2B2A28;--muted:#7A746A;--accent:#9C8A67;--gold:#9C8A67;--line:#D9D1C2;--btn-fg:#FFFFFF;--ground:#E9E4DA;
  --f-display:"Cormorant Garamond","Times New Roman",serif;--f-body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --names-size:3.2rem;--names-style:italic;--names-weight:500;
  background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;position:relative;overflow:hidden;color-scheme:light}
.inv[data-tpl="suzani"]{--ground:#E6D6BE;--paper:#F3EADB;--surface:#FBF5EA;--ink:#3A1E1E;--muted:#7D5A50;--accent:#A3262E;--gold:#B8893B;--line:#E1CDB0;
  --f-display:"Prata",Georgia,serif;--f-body:"Lora",Georgia,serif;--names-size:2.7rem;--names-style:normal;--names-weight:400}
.inv[data-tpl="samarqand"]{--ground:#0A1E45;--paper:#0F2A5C;--surface:#163670;--ink:#F4EBD8;--muted:#B9C4DA;--accent:#3FB6B0;--gold:#D4A64A;--line:rgba(212,166,74,.45);--btn-fg:#0F2A5C;
  --f-display:"Forum",Georgia,serif;--f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;--names-size:3rem;--names-style:normal;--names-weight:400;color-scheme:dark}
.inv .sec{padding:44px 26px;text-align:center;position:relative}

/* ================= ornaments ================= */
function rosette(size,c1,c2,c3){let p="";for(let i=0;i<12;i++)p+=`<ellipse cx="50" cy="24" rx="7" ry="17" fill="${c1}" transform="rotate(${i*30} 50 50)"/>`;for(let i=0;i<12;i++)p+=`<ellipse cx="50" cy="31" rx="4" ry="9" fill="${c2}" transform="rotate(${i*30+15} 50 50)"/>`;p+=`<circle cx="50" cy="50" r="15" fill="${c2}"/><circle cx="50" cy="50" r="11" fill="${c3}"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;p+=`<circle cx="${(50+6*Math.cos(a)).toFixed(2)}" cy="${(50+6*Math.sin(a)).toFixed(2)}" r="1.6" fill="${c1}"/>`}return `<svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">${p}</svg>`}
function pomegranate(c,g){return `<svg viewBox="0 0 60 60" width="34" height="34" aria-hidden="true"><path d="M30 14c-12 0-20 9-20 21s9 19 20 19 20-7 20-19-8-21-20-21z" fill="${c}"/><path d="M24 15l2-7 4 4 4-4 2 7z" fill="${g}"/><circle cx="25" cy="34" r="2.2" fill="${g}"/><circle cx="33" cy="30" r="2.2" fill="${g}"/><circle cx="35" cy="39" r="2.2" fill="${g}"/><circle cx="27" cy="43" r="2.2" fill="${g}"/></svg>`}
let bandN=0;
function starBand(c,bg){const id="sb"+(bandN++);return `<svg class="band" viewBox="0 0 400 26" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="${id}" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="${bg}"/><g transform="translate(13 13)"><rect x="-6" y="-6" width="12" height="12" fill="none" stroke="${c}" stroke-width="1.2"/><rect x="-6" y="-6" width="12" height="12" fill="none" stroke="${c}" stroke-width="1.2" transform="rotate(45)"/><circle r="1.8" fill="${c}"/></g></pattern></defs><rect width="400" height="26" fill="url(#${id})"/></svg>`}
function arch(c){return `<svg class="arch" viewBox="0 0 200 300" preserveAspectRatio="none" aria-hidden="true"><path d="M8 296V112C8 58 60 22 100 8c40 14 92 50 92 104v184" fill="none" stroke="${c}" stroke-width="1.4" vector-effect="non-scaling-stroke"/><path d="M16 296V114C16 66 64 34 100 20c36 14 84 46 84 94v182" fill="none" stroke="${c}" stroke-width=".8" opacity=".6" vector-effect="non-scaling-stroke"/></svg>`}
function sprig(c){return `<svg viewBox="0 0 120 20" width="120" height="20" aria-hidden="true"><line x1="0" y1="10" x2="48" y2="10" stroke="${c}" stroke-width=".8"/><line x1="72" y1="10" x2="120" y2="10" stroke="${c}" stroke-width=".8"/><circle cx="60" cy="10" r="3.2" fill="none" stroke="${c}" stroke-width=".9"/><circle cx="52" cy="10" r="1.2" fill="${c}"/><circle cx="68" cy="10" r="1.2" fill="${c}"/></svg>`}
function divider(tpl){const P=PAL[tpl];
  if(tpl==="suzani")return `<div class="divider">${pomegranate(P.accent,P.gold)}</div>`;
  if(tpl==="samarqand")return `<div class="divider"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><g transform="translate(20 20)" fill="none" stroke="${P.gold}" stroke-width="1.3"><rect x="-10" y="-10" width="20" height="20"/><rect x="-10" y="-10" width="20" height="20" transform="rotate(45)"/></g><circle cx="20" cy="20" r="3" fill="${P.accent}"/></svg></div>`;
  return `<div class="divider">${sprig(P.accent)}</div>`}
function heroDecor(tpl){const P=PAL[tpl];
  if(tpl==="suzani"){const r=rosette(110,P.accent,P.gold,P.paper);return `<div class="corner tl">${r}</div><div class="corner tr">${r}</div>`}
  if(tpl==="samarqand")return arch(P.gold);return ""}

/* ================= invitation renderer ================= */
function evDate(ev){return new Date(ev.date+"T"+(ev.time||"18:00")+":00+05:00")}
function weekday(ev){return new Date(ev.date+"T12:00:00Z").getUTCDay()}
function fill(s,ev){return String(s||"").replace(/\{g\}/g,ev.g||"").replace(/\{b\}/g,ev.b||"")}
function txt(ev,field,lang){const v=ev[field]||{};return v[lang]!=null&&v[lang]!==""?v[lang]:(v.uz||v.ru||"")}
function namesHTML(ev,lang){return ev.kind==="wedding"?`${esc(ev.g)}<span class="amp">${IT[lang].amp}</span>${esc(ev.b)}`:esc(ev.g)}
function initials(ev){return ev.kind==="wedding"?((ev.g||"?")[0]+"&"+(ev.b||"?")[0]):(ev.g||"?")[0]}
function calendar(ev,lang){const t=IT[lang];const [y,m,dd]=ev.date.split("-").map(Number);const first=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(y,m,0)).getUTCDate();
  let h=t.wd.map(w=>`<div class="wd">${w}</div>`).join("");for(let i=0;i<first;i++)h+="<div></div>";for(let d=1;d<=days;d++)h+=`<div class="d${d===dd?" on":""}"><span>${d}</span></div>`;
  return `<div class="cal"><div class="cal-month">${MON[lang][m-1]} ${y}</div><div class="cal-grid">${h}</div></div>`}
function fmtDate(ev){const [y,m,d]=ev.date.split("-");return `${d} · ${m} · ${y}`}

function rsvpForm(lang,pfx){const t=IT[lang];return `<form class="gform" data-pfx="${pfx}" novalidate>
  <label class="gf" for="${pfx}n">${t.name}<input type="text" id="${pfx}n" autocomplete="name" placeholder="${t.namePh}"></label>
  <div class="opts" role="radiogroup">
   <label class="opt"><input type="radio" name="${pfx}o" value="o1">${t.o1}</label>
   <label class="opt"><input type="radio" name="${pfx}o" value="o2">${t.o2}</label>
   <label class="opt"><input type="radio" name="${pfx}o" value="o3">${t.o3}</label></div>
  <label class="gf" for="${pfx}c">${t.count}<input type="number" id="${pfx}c" min="1" max="30" value="1" inputmode="numeric"></label>
  <label class="gf" for="${pfx}m">${t.comment}<textarea id="${pfx}m"></textarea></label>
  <div class="gerr" aria-live="polite"></div>
  <button type="submit" class="ibtn solid">${t.send}</button></form>`}

function inviteHTML(ev,lang,mode){
  const t=IT[lang],P=PAL[ev.tpl],tpl=ev.tpl,pfx=mode+"_";
  const dl=ev.rsvpBy?new Date(ev.rsvpBy+"T12:00:00Z"):null;
  const prog=(ev.program||[]).filter(r=>r.time||r.uz||r.ru);
  const contacts=(ev.contacts||[]).filter(c=>c.name||c.phone);
  const dress=txt(ev,"dress",lang);
  const photo=ev.photo&&ev.opts&&ev.opts.photo;
  const band=tpl==="samarqand"?starBand(P.gold,P.paper):"";
  return `<div class="inv" data-tpl="${tpl}">

    <div class="kicker">${t.kinds[ev.kind]}</div>

    <div class="hero-date">${fmtDate(ev)}</div>
    <div class="hero-day">${t.days[weekday(ev)]} · ${esc(ev.time)}</div>
  </section>
  ${photo?`<section class="sec"><div class="frame"><img src="${ev.photo}" alt=""></div></section>`:""}
  ${band}
  <section class="sec">${divider(tpl)}<h2 class="ih2">${t.dear}</h2><p>${esc(fill(txt(ev,"text",lang),ev))}</p>
    ${txt(ev,"sign",lang)?`<p class="imuted" style="margin-top:16px;font-style:italic">${esc(txt(ev,"sign",lang))}</p>`:""}</section>
  <section class="sec"><div class="kicker">${t.dateH}</div><div style="height:12px"></div>${calendar(ev,lang)}<div class="time-line">${t.start(esc(ev.time))}</div></section>
  <section class="sec"><div class="kicker">${t.cdH}</div><div style="height:14px"></div><div class="cd" data-ts="${evDate(ev).getTime()}" data-lang="${lang}"></div></section>
  <section class="sec">${divider(tpl)}<h2 class="ih2">${t.venueH}</h2><div class="venue-name">${esc(ev.venue)}</div><div class="imuted">${esc(ev.addr)}</div>
    <div class="maps">${ev.map?`<a class="ibtn" href="${esc(ev.map)}" target="_blank" rel="noopener">${lang==="uz"?"Xaritada ochish":"Открыть на карте"}</a>`:""}
    <a class="ibtn" href="https://yandex.uz/maps/?text=${encodeURIComponent((ev.venue||"")+" "+(ev.addr||""))}" target="_blank" rel="noopener">Yandex</a>
    <a class="ibtn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((ev.venue||"")+" "+(ev.addr||""))}" target="_blank" rel="noopener">Google</a></div></section>
  ${prog.length?`<section class="sec"><h2 class="ih2">${t.progH}</h2><ol class="prog">${prog.map(r=>`<li><time>${esc(r.time)}</time><span>${esc(r[lang]||r.uz||r.ru)}</span></li>`).join("")}</ol></section>`:""}
  ${dress?`<section class="sec"><h2 class="ih2">${t.dressH}</h2><p>${esc(dress)}</p></section>`:""}
  ${band}
  <section class="sec">${divider(tpl)}<h2 class="ih2">${t.rsvpH}</h2>${dl?`<p class="imuted" style="margin-bottom:20px">${t.rsvpSub(dl)}</p>`:""}<div class="rsvp-box">${rsvpForm(lang,pfx)}</div></section>
  ${contacts.length?`<section class="sec"><h2 class="ih2">${t.contactsH}</h2><div class="contacts">${contacts.map(c=>`<div class="contact"><div><small>${esc(c.label)}</small>${esc(c.name)}${c.phone?` · <span class="num">${esc(c.phone)}</span>`:""}</div></div>`).join("")}</div></section>`:""}
  <section class="sec final">${divider(tpl)}<div class="ih2" style="margin-bottom:4px">${t.fin}</div><div class="names">${esc(initials(ev).replace("&"," & "))}</div><div class="brand">taklifnoma</div></section>
  </div>`}

function miniHTML(ev,lang){const t=IT[lang],tpl=ev.tpl;
  return `<div class="inv" data-tpl="${tpl}"><section class="sec hero">${heroDecor(tpl)}<div class="kicker">${t.kinds[ev.kind]}</div><div class="names">${namesHTML(ev,lang)}</div><div class="hero-date">${fmtDate(ev)}</div><div class="hero-day">${t.days[weekday(ev)]} · ${esc(ev.time)}</div></section>${tpl==="samarqand"?starBand(PAL[tpl].gold,PAL[tpl].paper):""}<section class="sec">${divider(tpl)}<div class="ih2">${t.dear}</div><p>${esc(fill(txt(ev,"text",lang),ev))}</p></section></div>`}
function printCard(ev,lang,link){const t=IT[lang],P=PAL[ev.tpl];
  const r=ev.tpl==="suzani"?rosette(100,P.accent,P.gold,P.paper):"";
  return `<div class="inv a6" data-tpl="${ev.tpl}">
   <div class="safe-line" aria-hidden="true"></div>
   ${ev.tpl==="suzani"?`<div class="corner tl">${r}</div><div class="corner tr">${r}</div>`:""}${ev.tpl==="samarqand"?arch(P.gold):""}
   <div style="position:relative"><div class="kicker">${t.kinds[ev.kind]}</div><div class="names">${namesHTML(ev,lang)}</div><div class="ps">${t.printText}</div></div>
   <div style="position:relative"><div class="dt">${fmtDate(ev)}</div><div class="ps">${t.days[weekday(ev)]}, ${esc(ev.time)} · ${esc(ev.venue)}<br>${esc(ev.addr)}</div></div>
   <div class="qr-plate" style="position:relative"><div class="qr">${qrSvg(link)}</div><span>${t.qr}</span></div></div>`}

function tickAll(){$$(".cd[data-ts]").forEach(el=>{const t=IT[el.dataset.lang];let s=Math.floor((+el.dataset.ts-Date.now())/1000);
  if(s<=0){el.style.display="block";el.innerHTML=`<p>${t.cdDone}</p>`;return}
  const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];el.innerHTML=v.map((n,i)=>`<div><b>${String(n).padStart(2,"0")}</b><small>${t.cd[i]}</small></div>`).join("")})}
setInterval(tickAll,1000);

/* ================= music (generated in the browser as a stand-in for the licensed library) ================= */
const SONGS={t1:{ch:[[57,64,69,72],[53,60,65,69],[48,55,60,64],[55,62,67,71]],ms:360,wave:"triangle",pat:[0,1,2,3,2,1]},
  t2:{ch:[[60,64,67,72],[55,59,62,67],[57,60,64,69],[53,57,60,65]],ms:300,wave:"sine",pat:[0,2,1,3,2,1,0,2]},
  t3:{ch:[[50,57,62,65],[46,53,58,62],[53,57,60,65],[48,55,60,64]],ms:420,wave:"triangle",pat:[0,2,3]}};
const AU={ctx:null,timer:null,step:0,el:null,cur:null};
function midi(n){return 440*Math.pow(2,(n-69)/12)}
function stopMusic(){clearInterval(AU.timer);AU.timer=null;if(AU.el){AU.el.pause()}AU.cur=null;$$(".music").forEach(b=>b.classList.remove("playing"));$$("[data-play]").forEach(b=>b.textContent="Слушать")}
function playMusic(id){stopMusic();if(!id||id==="none")return;AU.cur=id;
  if(id==="own"){const url=MEM.audio.url;if(!url){toast("Своя мелодия хранится только в этой сессии демо");return}AU.el=AU.el||new Audio();AU.el.src=url;AU.el.loop=true;AU.el.play().catch(()=>{});$$(".music").forEach(b=>b.classList.add("playing"));return}
  try{if(!AU.ctx){AU.ctx=new(window.AudioContext||window.webkitAudioContext)();const m=AU.ctx.createGain();m.gain.value=.5;const dl=AU.ctx.createDelay();dl.delayTime.value=.33;const fb=AU.ctx.createGain();fb.gain.value=.26;m.connect(AU.ctx.destination);m.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(AU.ctx.destination);AU.master=m}
    AU.ctx.resume();const S2=SONGS[id];AU.step=0;
    AU.timer=setInterval(()=>{const pl=S2.pat.length,ch=S2.ch[Math.floor(AU.step/(pl*2))%4],i=AU.step%pl,now=AU.ctx.currentTime+.05;note(midi(ch[S2.pat[i]]+12),now,1.3,.11,S2.wave);if(i===0)note(midi(ch[0]-12),now,2.4,.09,S2.wave);AU.step++},S2.ms);
    $$(".music").forEach(b=>b.classList.add("playing"))}catch(e){}}
function note(f,w,d,v,wave){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=wave;o.frequency.value=f;g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(v,w+.03);g.gain.exponentialRampToValueAtTime(.0008,w+d);o.connect(g);g.connect(AU.master);o.start(w);o.stop(w+d+.05)}

/* ================= bot (imitation of the Telegram bot) ================= */
let botOpen=false;
function botSay(text,extra){S.bot.push(Object.assign({from:"b",text,t:nowT()},extra||{}));if(!botOpen)S.unread++;save();renderBot()}
function meSay(text){S.bot.push({from:"m",text,t:nowT()});save();renderBot()}
function openBot(){botOpen=true;S.unread=0;save();renderBot();renderHeaderBadge()}
function closeBot(){botOpen=false;renderBot()}
function renderBot(){const r=$("#botRoot");const route=parseRoute();
  if(route[0]==="g"||route[0]==="pay"){r.innerHTML="";return}
  if(!botOpen){r.innerHTML=S.user||route[0]==="login"?`<button type="button" class="bot-fab" id="botFab">${ICON.tg} Бот${S.unread?` <span class="badge">${S.unread}</span>`:""}</button>`:"";const f=$("#botFab");if(f)f.onclick=openBot;return}
  r.innerHTML=`<div class="bot" role="dialog" aria-label="Бот @taklifnoma_bot (имитация)">
   <div class="bot-h"><div class="bot-av">T</div><div><div class="nm">Taklifnoma Bot</div><div class="st">@taklifnoma_bot · имитация</div></div><button type="button" class="btn sm cl" id="botClose">Свернуть</button></div>
   <div class="bot-msgs" id="botMsgs">${S.bot.length?S.bot.map((m,i)=>msgHTML(m,i)).join(""):`<div class="msg b">Нажмите «Войти через Telegram» на сайте, чтобы начать.<span class="tm">${nowT()}</span></div>`}</div>
   <div class="bot-foot">Так будет выглядеть бот в Telegram. В демо он работает внутри страницы.</div></div>`;
  $("#botClose").onclick=closeBot;const ms=$("#botMsgs");ms.scrollTop=ms.scrollHeight;
  $$("[data-kb]",ms).forEach(b=>b.onclick=()=>botAction(b.dataset.kb,b.dataset.arg))}
function msgHTML(m,i){
  let body=esc(m.text);
  if(m.code)body+=`\n<span class="code">${m.code}</span>`;
  if(m.file)body=`<div class="file"><div class="fi">XLSX</div><div><b>${esc(m.file)}</b><br><span style="font-size:12px;color:#6D7A86">${esc(m.text)}</span></div></div>`;
  const kb=(m.kb&&!m.used)?`<div class="kb">${m.kb.map(k=>`<button type="button" data-kb="${k.a}" data-arg="${esc(k.arg||i)}">${esc(k.l)}</button>`).join("")}</div>`:"";
  return `<div class="msg ${m.from}">${body}<span class="tm">${m.t}</span></div>${kb}`}
function botAction(a,arg){
  if(a==="contact"){const m=S.bot[+arg];if(m)m.used=true;meSay("Контакт: +998 90 123 45 67");
    const code=String(Math.floor(100000+Math.random()*900000));S.pendingCode=code;save();
    setTimeout(()=>botSay("Код для входа на сайт. Никому его не сообщайте.",{code}),600);
    setTimeout(()=>{botSay("Введите этот код на сайте, окно с кодом уже открыто.",{kb:[{l:"Вернуться на сайт",a:"back"}]})},900)}
  if(a==="back"){closeBot();const i=$("#c0");if(i)i.focus()}
  if(a==="xlsx"){const ev=S.events.find(e=>e.id===arg);if(ev)downloadXlsx(ev)}
}
function renderHeaderBadge(){}

/* ================= router ================= */
function parseRoute(){return (location.hash.replace(/^#\/?/,"")||"").split("/").filter(Boolean)}
function go(h){if(location.hash==="#"+h)render();else location.hash=h}
window.addEventListener("hashchange",()=>{stopMusic();$$("#layer .sms").forEach(x=>x.remove());render();window.scrollTo(0,0)});
function needAuth(){if(!S.user){go("/login");return true}return false}
function getEv(id){return S.events.find(e=>e.id===id)}

function header(){return `<header class="hdr gut"><div class="container"><a class="logo" href="#/">Taklif<span>noma</span></a>
  <div class="hdr-r"><span class="demo-tag">демо</span>${S.user?`<a class="btn sm ghost" href="#/app">Мои приглашения</a>`:`<a class="btn sm" href="#/login">Войти</a>`}</div></div></header>`}
function footer(){return `<footer class="foot gut"><div class="container"><span>Демо-версия. Данные хранятся только в этом браузере, оплата и SMS имитируются.</span><button type="button" class="linkbtn" id="resetDemo">Сбросить демо</button></div></footer>`}

function render(){
  const r=parseRoute(),root=$("#root");bandN=0;
  document.body.style.background="";
  let html="",after=null;
  switch(r[0]){
    case undefined: case "": ({html,after}=vLanding());break;
    case "login": ({html,after}=vLogin());break;
    case "app": if(needAuth())return; ({html,after}=vDash());break;
    case "new": if(needAuth())return; {const ev=newEvent();S.events.unshift(ev);save();location.replace("#/edit/"+ev.id);return}
    case "edit": if(needAuth())return; ({html,after}=vEdit(r[1],+r[2]||0));break;
    case "checkout": if(needAuth())return; ({html,after}=vCheckout(r[1]));break;
    case "pay": if(needAuth())return; ({html,after}=vPay(r[1]));break;
    case "done": if(needAuth())return; ({html,after}=vDone(r[1]));break;
    case "event": if(needAuth())return; ({html,after}=vEvent(r[1]));break;
    case "print": if(needAuth())return; ({html,after}=vPrint(r[1]));break;
    case "g": ({html,after}=vGuest(r[1]));break;
    default: ({html,after}=vLanding());
  }
  root.innerHTML=html; if(after)after();
  const rs=$("#resetDemo");if(rs)rs.onclick=()=>{if(rs.dataset.armed){try{localStorage.removeItem(KEY)}catch(e){}S=blank();botOpen=false;go("/");renderBot()}else{rs.dataset.armed=1;rs.textContent="Нажмите ещё раз, чтобы удалить все данные демо"}};
  tickAll();renderBot();
}

function langsOf(ev){return ev.langs==="both"?["uz","ru"]:[ev.langs]}
function title(ev){return ev.kind==="wedding"?`${ev.g||"…"} & ${ev.b||"…"}`:(ev.g||"…")}
function items(ev){const it=[{k:"base",l:`Шаблон «${TPL_NAME[ev.tpl]}»`,p:PRICE.base}];
  if(ev.opts.music&&ev.music!=="none")it.push({k:"music",l:"Музыка",p:PRICE.music});
  if(ev.opts.photo&&ev.photo)it.push({k:"photo",l:"Свои фото",p:PRICE.photo});
  if(ev.opts.print)it.push({k:"print",l:"Выгрузка для печати (PDF)",p:PRICE.print});return it}
function due(ev){return items(ev).filter(i=>!ev.paid[i.k])}
function pubData(ev){const c=Object.assign({},ev);delete c.photo;delete c.rsvps;delete c.paid;delete c.musicAgree;return c}
function guestLink(ev){return location.origin+location.pathname+"#/g/"+enc(pubData(ev))}
function prettyLink(ev){return "taklifnoma.uz/"+(ev.slug||ev.id)}

/* ================= views ================= */

  const demo=newEvent();

function vLogin(){
  if(S.user)return{html:header()+`<main class="gut"><div class="panel auth stack"><div class="h2">Вы уже вошли</div><p class="muted">${esc(S.user.phone)}</p><a class="btn pri" href="#/app">Мои приглашения</a></div></main>`,after:null};
  const started=!!S.pendingCode;
  return{html:header()+`<main class="gut"><div class="panel auth">
    <div class="h2" style="margin-bottom:6px">Вход через Telegram</div>
    <p class="muted small" style="margin:0 0 10px">Пароль не нужен. Бот подтвердит ваш номер и пришлёт код.</p>
    <div class="tg-step ${started?"done":""}"><div class="n">1</div><div style="flex:1"><b>Откройте бота</b><div class="small muted">Нажмите кнопку и поделитесь номером телефона</div><div style="margin-top:10px"><button type="button" class="btn pri" id="openTg">${ICON.tg} Открыть @taklifnoma_bot</button></div></div></div>
    <div class="tg-step"><div class="n">2</div><div style="flex:1"><b>Введите код из бота</b>
      <div class="code-in" id="codeIn">${[0,1,2,3,4,5].map(i=>`<input id="c${i}" inputmode="numeric" maxlength="1" aria-label="Цифра ${i+1}" autocomplete="one-time-code">`).join("")}</div>
      <div class="err" id="cerr" aria-live="polite"></div>
      <button type="button" class="btn pri wide" id="cgo">Войти</button>
      <div class="small muted" style="margin-top:8px">Код не пришёл? <button type="button" class="linkbtn" id="resend">Отправить снова</button></div></div></div>
  </div></main>`,after(){
    $("#openTg").onclick=()=>{if(!S.bot.some(m=>m.kb&&m.kb[0]&&m.kb[0].a==="contact"&&!m.used)){meSay("/start");setTimeout(()=>botSay("Assalomu alaykum! Добро пожаловать в Taklifnoma.\nЧтобы войти на сайт, поделитесь номером телефона.",{kb:[{l:"Отправить номер телефона",a:"contact",arg:String(S.bot.length)}]}),400)}openBot()};
    $("#resend").onclick=()=>{S.pendingCode=null;save();$("#openTg").click()};
    const ins=$$("#codeIn input");
    ins.forEach((inp,i)=>{inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"").slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))tryLogin()});
      inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!inp.value&&ins[i-1])ins[i-1].focus()});
      inp.addEventListener("paste",e=>{const v=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);if(v.length){e.preventDefault();ins.forEach((x,j)=>x.value=v[j]||"");tryLogin()}})});
    $("#cgo").onclick=tryLogin;
    function tryLogin(){const v=ins.map(x=>x.value).join("");const err=$("#cerr");
      if(!S.pendingCode){err.textContent="Сначала откройте бота и отправьте номер телефона.";return}
      if(v.length<6){err.textContent="Введите все 6 цифр кода.";return}
      if(v!==S.pendingCode){err.textContent="Код не подходит. Проверьте сообщение от бота.";ins.forEach(x=>x.value="");ins[0].focus();return}
      S.user={phone:"+998 90 123 45 67",since:Date.now()};S.pendingCode=null;save();
      botSay("Вы вошли на сайт. Сюда будут приходить ответы гостей, оплаты и списки в Excel.");closeBot();go("/app")}
  }}}

function vDash(){
  const evs=S.events;
  const cards=evs.map(ev=>{const yes=ev.rsvps.filter(r=>r.opt!=="o3"),ppl=yes.reduce((a,r)=>a+r.count,0);
    return `<div class="panel ev-card"><div class="row" style="justify-content:space-between"><span class="pill ${ev.status==="live"?"ok":"draft"}">${ev.status==="live"?"Опубликовано":"Черновик"}</span><span class="small muted">${TPL_NAME[ev.tpl]} · ${fmtDate(ev).replace(/ · /g,".")}</span></div>
     <div class="t">${esc(title(ev))}</div>
     ${ev.status==="live"?`<div class="kv"><span>Ответили: <b>${ev.rsvps.length}</b></span><span>Придут: <b>${ppl}</b> чел.</span></div>`:`<div class="small muted">Не опубликовано. К оплате: ${sum(due(ev).reduce((a,i)=>a+i.p,0))}</div>`}
     <div class="row">${ev.status==="live"?`<a class="btn pri sm" href="#/event/${ev.id}">Гости и ответы</a><a class="btn sm" href="#/edit/${ev.id}">Редактировать</a>`:`<a class="btn pri sm" href="#/edit/${ev.id}">Продолжить</a>`}</div></div>`}).join("");
  return{html:header()+`<main class="gut"><div class="container page">
   <div class="page-head"><div><div class="lbl">Кабинет</div><h1 class="h2" style="font-size:1.7rem">Мои приглашения</h1></div><a class="btn pri" href="#/new">Создать приглашение</a></div>
   ${evs.length?`<div class="ev-list">${cards}</div>`:`<div class="panel empty stack" style="justify-items:center"><div class="h3">Здесь появятся ваши приглашения</div><p class="muted" style="margin:0">Создайте первое: мы заполним его примером, вы замените данные на свои.</p><a class="btn pri" href="#/new">Создать приглашение</a></div>`}
  </div></main>`+footer(),after:null}}

/* ----- builder ----- */
const STEPS=["Шаблон","Имена и дата","Место и программа","Текст","Фото и музыка","Гости и печать"];
let prevLang="uz";
function vEdit(id,step){
  const ev=getEv(id);if(!ev)return{html:header()+`<main class="gut"><div class="container page"><p>Приглашение не найдено. <a href="#/app">В кабинет</a></p></div></main>`,after:null};
  if(!langsOf(ev).includes(prevLang))prevLang=langsOf(ev)[0];
  const L=langsOf(ev),LN={uz:"узб.",ru:"рус."};
  const per=(path,label,ta)=>L.map(l=>`<label class="f"><span>${label}${L.length>1?` (${LN[l]})`:""}</span>${ta?`<textarea data-k="${path}.${l}">${esc(getPath(ev,path+"."+l)||"")}</textarea>`:`<input type="text" data-k="${path}.${l}" value="${esc(getPath(ev,path+"."+l)||"")}">`}</label>`).join("");
  const bodies=[
   ()=>`<div class="f"><span>Событие</span><div class="seg" data-seg="kind">${[["wedding","Свадьба"],["beshik","Бешик-той"],["birthday","День рождения"]].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${ev.kind===v}">${l}</button>`).join("")}</div></div>
     <div class="f"><span>Шаблон</span><div class="tpl-pick">${["ivory","suzani","samarqand"].map(tp=>`<button type="button" class="tpl-opt" data-tpl="${tp}" aria-pressed="${ev.tpl===tp}"><div class="mini">${miniHTML(Object.assign({},ev,{tpl:tp}),L[0])}</div><div class="cap">${TPL_NAME[tp]}<span class="muted">250 000</span></div></button>`).join("")}</div></div>
     <div class="f"><span>Язык приглашения</span><div class="seg" data-seg="langs">${[["uz","Узбекский"],["ru","Русский"],["both","Оба, гость выбирает"]].map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${ev.langs===v}">${l}</button>`).join("")}</div></div>`,
   ()=>`<div class="grid2"><label class="f"><span>${ev.kind==="wedding"?"Имя жениха":ev.kind==="beshik"?"Имя малыша":"Имя именинника"}</span><input type="text" data-k="g" value="${esc(ev.g)}" maxlength="24"></label>
      ${ev.kind==="wedding"?`<label class="f"><span>Имя невесты</span><input type="text" data-k="b" value="${esc(ev.b)}" maxlength="24"></label>`:"<div></div>"}</div>
     <div class="grid2"><label class="f"><span>Дата</span><input type="date" data-k="date" value="${esc(ev.date)}"></label><label class="f"><span>Начало</span><input type="time" data-k="time" value="${esc(ev.time)}"></label></div>
     <p class="hint" style="margin:0">Имена пишите так, как они должны стоять в приглашении. Длинные имена шаблон уменьшит сам.</p>`,
   ()=>`<label class="f"><span>Тойхона и зал</span><input type="text" data-k="venue" value="${esc(ev.venue)}"></label>
     <label class="f"><span>Адрес</span><input type="text" data-k="addr" value="${esc(ev.addr)}"></label>
     <label class="f"><span>Ссылка на карту (необязательно)</span><input type="text" data-k="map" value="${esc(ev.map)}" placeholder="Вставьте ссылку из Яндекс Карт или Google Maps"></label>
     <div class="f"><span>Программа</span><div class="stack" style="gap:10px" id="progRows">${ev.program.map((r,i)=>`<div class="prog-row"><input type="time" data-k="program.${i}.time" value="${esc(r.time)}" style="border:1px solid var(--line);border-radius:10px;padding:10px 8px"><div class="both">${L.map(l=>`<input type="text" data-k="program.${i}.${l}" value="${esc(r[l]||"")}" placeholder="${l==="uz"?"O’zbekcha":"По-русски"}" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px">`).join("")}</div><button type="button" class="x" data-del="${i}" aria-label="Удалить пункт">×</button></div>`).join("")}</div>
       <div><button type="button" class="btn sm" id="addProg">Добавить пункт</button></div></div>`,
   ()=>`<div class="row"><span class="small muted">Готовый текст под событие:</span><button type="button" class="btn sm" id="preset">Вставить шаблонный текст</button></div>
     ${per("text","Текст приглашения",true)}${per("sign","Подпись",false)}${per("dress","Дресс-код (необязательно)",false)}
     <p class="hint" style="margin:0">{g} и {b} в тексте заменяются на имена.</p>`,
   ()=>`<div class="paid-box"><div class="top"><div><b>Свои фото</b><div class="small muted">Фото пары в рамке шаблона</div></div><span class="price-tag">+100 000 сум</span></div>
       <div class="photo-prev">${ev.photo?`<img src="${ev.photo}" alt="Загруженное фото">`:""}<div class="row"><label class="btn sm" for="photoIn">${ev.photo?"Заменить фото":"Загрузить фото"}</label><input type="file" id="photoIn" accept="image/*" hidden>${ev.photo?`<button type="button" class="btn sm ghost" id="photoDel">Убрать</button>`:""}</div></div>
       ${ev.paid.photo?`<span class="pill ok">Оплачено</span>`:""}</div>
     <div class="paid-box"><div class="top"><div><b>Музыка</b><div class="small muted">Включается, когда гость открывает конверт</div></div><span class="price-tag">+50 000 сум</span></div>
       <div class="radio-list">
        <label><input type="radio" name="mus" value="none" ${ev.music==="none"?"checked":""}>Без музыки</label>
        ${TRACKS.map(t=>`<label><input type="radio" name="mus" value="${t.id}" ${ev.music===t.id?"checked":""}><span><b>${t.name}</b> <span class="small muted">· ${t.desc}</span></span><button type="button" class="btn sm play" data-play="${t.id}">Слушать</button></label>`).join("")}
        <label><input type="radio" name="mus" value="own" ${ev.music==="own"?"checked":""}><span><b>Своя мелодия</b> <span class="small muted">· mp3 или m4a до 10 МБ</span></span></label></div>
       <div id="ownBox" ${ev.music==="own"?"":"hidden"} class="stack" style="gap:10px">
        <div class="row"><label class="btn sm" for="audIn">${MEM.audio.name?"Заменить файл":"Выбрать файл"}</label><input type="file" id="audIn" accept="audio/*" hidden><span class="small">${esc(MEM.audio.name||ev.ownName||"Файл не выбран")}</span></div>
        <label class="check"><input type="checkbox" id="agree" ${ev.musicAgree?"checked":""}><span>Я подтверждаю, что у меня есть право использовать эту мелодию, и принимаю ответственность за претензии правообладателей.</span></label></div>
       ${ev.paid.music?`<span class="pill ok">Оплачено</span>`:""}</div>`,
   ()=>`<label class="f"><span>Адрес ссылки</span><div class="row" style="flex-wrap:nowrap;gap:0"><span style="border:1px solid var(--line);border-right:0;border-radius:10px 0 0 10px;padding:10px 10px;background:var(--soft);font-size:14px;white-space:nowrap">taklifnoma.uz/</span><input type="text" data-k="slug" value="${esc(ev.slug)}" style="border-radius:0 10px 10px 0;min-width:0"></div></label>
     <label class="f"><span>Ответить до</span><input type="date" data-k="rsvpBy" value="${esc(ev.rsvpBy)}"></label>
     <div class="f"><span>Контакты организаторов</span>${ev.contacts.map((c,i)=>`<div class="grid2" style="margin-bottom:8px"><input type="text" data-k="contacts.${i}.name" value="${esc(c.name)}" placeholder="Имя" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px"><input type="tel" data-k="contacts.${i}.phone" value="${esc(c.phone)}" placeholder="+998 ..." style="border:1px solid var(--line);border-radius:10px;padding:10px 12px"></div>`).join("")}</div>
     <div class="paid-box"><div class="top"><div><b>Печатная версия</b><div class="small muted">Открытка A6 в этом же стиле с QR-кодом на приглашение. PDF для любой типографии.</div></div><span class="price-tag">+100 000 сум</span></div>
       <label class="check"><input type="checkbox" id="optPrint" ${ev.opts.print?"checked":""}><span>Добавить выгрузку для печати</span></label>
       ${ev.paid.print?`<span class="pill ok">Оплачено</span>`:""}</div>`
  ];
  const tot=due(ev).reduce((a,i)=>a+i.p,0);
  const last=step===STEPS.length-1;
  return{html:header()+`<main class="gut"><div class="container page">
   <div class="page-head"><div><a class="small" href="#/app" style="text-decoration:none">${ICON.back.replace('class="ico"','class="ico" style="vertical-align:-4px"')} Мои приглашения</a><h1 class="h2" style="font-size:1.6rem;margin-top:4px">${esc(title(ev))}</h1></div>
     <button type="button" class="btn mob-prev-btn" id="mobPrev">${ICON.eye} Предпросмотр</button></div>
   <div class="builder"><div>
     <nav class="stepper" aria-label="Шаги">${STEPS.map((s,i)=>`<button type="button" data-step="${i}" ${i===step?'aria-current="step"':""} class="${i<step?"done":""}">${i+1}. ${s}</button>`).join("")}</nav>
     <div class="panel form" id="form">${bodies[step]()}
       <div class="form-nav"><div class="total-bar" style="flex:1"><span class="muted">${ev.status==="live"?(tot?"Доплата за новые опции":"Изменения сохраняются автоматически"):"Итого к оплате"}</span>${tot||ev.status!=="live"?`<b id="totNow">${sum(tot)}</b>`:""}</div>
        <div class="row">${step>0?`<button type="button" class="btn" data-step="${step-1}">Назад</button>`:""}
        ${last?(ev.status==="live"&&!tot?`<a class="btn pri" href="#/event/${ev.id}">Готово</a>`:`<a class="btn pri" href="#/checkout/${ev.id}" id="toPay">К оплате</a>`):`<button type="button" class="btn pri" data-step="${step+1}">Далее</button>`}</div></div>
     </div></div>
     <aside class="preview-col"><div class="prev-bar"><span class="lbl">Так увидит гость</span>${L.length>1?`<div class="seg" data-prevlang>${L.map(l=>`<button type="button" data-v="${l}" aria-pressed="${prevLang===l}">${l.toUpperCase()}</button>`).join("")}</div>`:""}</div>
       <div class="phone"><div class="scr" id="prev">${inviteHTML(ev,prevLang,"prev")}</div></div></aside>
   </div></div></main>`,after(){
    const save2=()=>{save();const p=$("#prev");if(p){const st=p.scrollTop;p.innerHTML=inviteHTML(ev,prevLang,"prev");p.scrollTop=st;bindGuestForms(ev,true)}const tn=$("#totNow");if(tn)tn.textContent=sum(due(ev).reduce((a,i)=>a+i.p,0));tickAll()};
    let tmr;const deb=()=>{clearTimeout(tmr);tmr=setTimeout(save2,180)};
    $$("[data-k]").forEach(inp=>inp.addEventListener("input",()=>{let v=inp.value;if(inp.dataset.k==="slug"){v=v.toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-");if(v!==inp.value)inp.value=v}setPath(ev,inp.dataset.k,v);deb()}));
    $$("[data-step]").forEach(b=>b.onclick=()=>go(`/edit/${ev.id}/${b.dataset.step}`));
    $$("[data-seg]").forEach(sg=>$$("button",sg).forEach(b=>b.onclick=()=>{const k=sg.dataset.seg;ev[k]=b.dataset.v;if(k==="kind"){ev.text={uz:PRESET[ev.kind].uz,ru:PRESET[ev.kind].ru};if(ev.kind!=="wedding")ev.b=""; else if(!ev.b)ev.b="Madina"}save();render()}));
    $$("[data-prevlang] button").forEach(b=>b.onclick=()=>{prevLang=b.dataset.v;$$("[data-prevlang] button").forEach(x=>x.setAttribute("aria-pressed",x===b));save2()});
    $$(".tpl-opt").forEach(b=>b.onclick=()=>{ev.tpl=b.dataset.tpl;save();render()});
    const ap=$("#addProg");if(ap)ap.onclick=()=>{ev.program.push({time:"",uz:"",ru:""});save();render()};
    $$("[data-del]").forEach(b=>b.onclick=()=>{ev.program.splice(+b.dataset.del,1);save();render()});
    const pr=$("#preset");if(pr)pr.onclick=()=>{ev.text={uz:PRESET[ev.kind].uz,ru:PRESET[ev.kind].ru};save();render()};
    const pi=$("#photoIn");if(pi)pi.onchange=()=>{const f=pi.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const W=720,sc=Math.min(1,W/img.width),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);ev.photo=c.toDataURL("image/jpeg",.78);ev.opts.photo=true;save();render();toast("Фото добавлено: +100 000 сум")};img.onerror=()=>toast("Не получилось открыть фото. Попробуйте JPG или PNG.");img.src=rd.result};rd.readAsDataURL(f)};
    const pd=$("#photoDel");if(pd)pd.onclick=()=>{ev.photo="";ev.opts.photo=false;save();render()};
    $$("input[name=mus]").forEach(r=>r.onchange=()=>{ev.music=r.value;ev.opts.music=r.value!=="none";const ob=$("#ownBox");if(ob)ob.hidden=r.value!=="own";save2()});
    $$("[data-play]").forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();if(AU.cur===b.dataset.play){stopMusic()}else{playMusic(b.dataset.play);b.textContent="Стоп"}});
    const ai=$("#audIn");if(ai)ai.onchange=()=>{const f=ai.files[0];if(!f)return;if(f.size>10*1024*1024){toast("Файл больше 10 МБ. Выберите другой.");return}if(MEM.audio.url)URL.revokeObjectURL(MEM.audio.url);MEM.audio={url:URL.createObjectURL(f),name:f.name};ev.ownName=f.name;save();render()};
    const ag=$("#agree");if(ag)ag.onchange=()=>{ev.musicAgree=ag.checked;save()};

    const r={name,opt,count:opt==="o3"?0:Math.max(1,parseInt($("input[type=number]",f).value,10)||1),comment:$("textarea",f).value.trim()};
    if(stored){addRsvp(ev,r);save()}
    const box=f.closest(".rsvp-box");box.innerHTML=`<div class="thanks" role="status"><b>${t.thx}</b><p>${esc(r.name)} — ${t[r.opt]}${r.opt!=="o3"?" · "+r.count:""}</p><p class="imuted">${r.opt!=="o3"?t.thxYes:t.thxNo}</p>${stored?"":`<p class="imuted" style="font-size:12px">Демо: ответ попадёт в кабинет, только если приглашение открыто на устройстве организатора.</p>`}</div>`}})}

render();
})();
</script>
</body>
</html>
